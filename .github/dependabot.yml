# Dependabot — https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    # Wait before opening a PR for a newly-published version (issue #192).
    #
    # The threat is a compromised maintainer account shipping a malicious
    # release: CI cannot detect a hostile `postinstall`, and `pnpm audit`
    # cannot see a zero-day, so a bad version would sail through auto-merge on
    # green checks. Malicious releases are typically yanked within days, so a
    # week of latency defeats most of that timeline at the cost of a week of
    # staleness. Majors wait longer — they need human review regardless.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # Split by dependency-type so the auto-merge gate below can distinguish
      # them. The single `patterns: ['*']` group this replaces was named
      # "production-dependencies" while actually matching everything,
      # production and development alike.
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      development-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      # Group dev-dep majors together — reviewed but merged on green CI.
      dev-dependencies-major:
        dependency-type: 'development'
        update-types: ['major']
    ignore:
      # @types/node tracks the Node.js LTS runtime (Node 22). Major bumps
      # would let the type system know about APIs the runtime doesn't ship.
      # Revisit when we move to a newer LTS (Node 24+).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is not consumable yet, and the blockers are upstream --
      # nothing in this repo can be changed to accept it (see #220):
      #   - typescript-eslint throws a hard runtime version guard on TS 7
      #     ("typescript-eslint does not support TS 7.0"). Its latest release
      #     (8.67.0) still declares `typescript: >=4.8.4 <6.1.0`, so bumping
      #     it does not help. This repo uses type-aware linting
      #     (strictTypeChecked + projectService), so dropping the TS
      #     integration is not a workaround either.
      #   - `astro check` crashes under the TS 7 native compiler:
      #     "Cannot read properties of undefined (reading 'fileExists')" in
      #     @astrojs/language-server's getTsconfig.
      # Note `tsc --noEmit` itself passes on TS 7 -- only the tooling around
      # it breaks. Revisit when typescript-eslint ships TS >=7.1 support
      # (typescript-eslint#10940) and @astrojs/language-server declares TS 7
      # compatibility.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'dependencies'
    # Same reasoning as npm above — a compromised action release is if
    # anything worse, since actions run with repository credentials.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # One PR per week for all action bumps (majors included) — green CI is
      # the gate, not human review of each individual tag.
      actions:
        patterns: ['*']
