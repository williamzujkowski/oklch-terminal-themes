name: Release (npm)

# Publishes to npm via **Trusted Publishing** (OIDC) — no `NPM_TOKEN`.
#
# One-time setup on https://www.npmjs.com/ before the first publish:
#   1. Sign in to your npm account.
#   2. Go to Access Tokens → Trusted Publishers → Add Trusted Publisher.
#      (Or visit https://www.npmjs.com/trusted-publishers/new directly.)
#   3. Configure:
#        Publisher:         GitHub Actions
#        Organization/User: williamzujkowski
#        Repository:        oklch-terminal-themes
#        Workflow filename: release.yml
#        Environment:       (leave blank)
#        Package name:      @williamzujkowski/oklch-terminal-themes
#   4. Save. The package doesn't have to exist yet — npm will trust this
#      workflow to claim the name on the first publish.
#
# After that, every tag push of `v*.*.*` triggers this workflow, which
# authenticates via the GitHub OIDC token and publishes with provenance.
#
# ## Why this is two jobs (issue #191)
#
# It used to be one, which meant `pnpm install --frozen-lockfile` — and every
# dependency lifecycle script it runs — executed in a job holding
# `id-token: write`. A compromised transitive dependency's `postinstall` could
# read ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN from the environment, mint the
# npm OIDC token, and publish an arbitrary tarball under this package name
# **with valid provenance**.
#
# That last part is the nuance worth keeping in mind: provenance attests that
# this workflow ran. It does not attest that the tarball was not tampered with
# inside the job. A consumer verifying provenance would see a green check.
#
# So the split is by credential, not by convenience:
#
#   build    runs untrusted code (install, build, tests) and holds NO
#            publish credential. Emits the artifacts as a build artifact.
#   publish  holds `id-token: write`, installs nothing, and runs only
#            `npm publish` against artifacts it downloads.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions: read-all

# NEVER cancel a publish. A run killed between `npm publish` and its
# completion leaves the registry in a state no rerun can reason about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deliberately no `id-token` and no `contents: write`. Dependency
    # lifecycle scripts run in this job; nothing here may hold a credential
    # that can publish or push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Must mirror what ci.yml gates on. These three were missing, so a tag
      # could publish something `main` CI would have rejected -- most
      # concretely a stale theme count in README.md, which ships to npm
      # (README.md is in package.json `files`). See #225.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:md
      - run: pnpm typecheck
      - run: pnpm test

      - name: Fetch upstream, build, validate
        run: |
          pnpm tsx scripts/fetch-upstream.ts
          pnpm build:data
          pnpm validate
          pnpm sync-theme-count:check
          pnpm build:ts

      - name: Verify tag matches package.json version
        run: |
          PKG_V="v$(node -p "require('./package.json').version")"
          [ "$PKG_V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json ${PKG_V} — merge the version-roll PR before tagging"; exit 1; }

      # `dist/` is gitignored, and `data/` is rebuilt above from freshly
      # fetched upstream — so both must travel to the publish job rather than
      # being re-derived there. Everything else in `files` (README, LICENSE,
      # NOTICE) comes from the checkout.
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            dist
            data
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to create the GitHub Release at the bottom
      id-token: write # required for both provenance attestation and OIDC auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # No `pnpm install` in this job at all: `npm publish` needs only the
      # files listed in `files`, not node_modules. That is the whole point of
      # the split — no third-party code executes while the OIDC token is
      # reachable.
      - name: Confirm the artifacts arrived
        run: |
          test -d dist || { echo "dist/ missing from build artifacts"; exit 1; }
          test -d data || { echo "data/ missing from build artifacts"; exit 1; }
          test -f dist/index.js || { echo "dist/index.js missing"; exit 1; }

      # Trusted-publishing support landed in npm 11.5.1+. Node 22 ships with an
      # older npm by default. Pinned to an exact version rather than `@latest`:
      # this runs immediately before publish, in the job holding the OIDC
      # token, so a compromised `latest` would be the shortest possible path
      # to a malicious release.
      - name: Upgrade npm for Trusted Publishing support
        run: npm install --global npm@12.0.2

      # `--ignore-scripts` because the only lifecycle hook here is
      # `prepare: husky || true`, which is irrelevant when publishing, and
      # running any script in this job would reintroduce what the split
      # removes.
      - name: Publish with provenance (OIDC)
        run: npm publish --access public --provenance --ignore-scripts

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # --generate-notes reads .github/release.yml to categorise PRs since
          # the previous tag. --verify-tag ensures the tag that triggered this
          # workflow is the one being released.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag

          # Prepend the install line and a CHANGELOG pointer.
          #
          # Done as a second `gh release edit` rather than by passing --notes
          # alongside --generate-notes: whether those two compose is not
          # documented, and if they do not, the generated PR list is silently
          # replaced. Reading the generated body back and prepending to it is
          # deterministic either way.
          #
          # A GitHub Release otherwise never mentions that the package is on
          # npm at all — the repo sidebar cannot surface an npmjs.com package,
          # so this and the README badges are the only linkage.
          BODY="$(gh release view "$VERSION" --json body --jq .body)"
          NPM_NAME="$(node -p "require('./package.json').name")"
          printf '**npm:** [`%s@%s`](https://www.npmjs.com/package/%s/v/%s) — published with provenance.\n\n```bash\npnpm add %s\n```\n\nFull prose notes for this release: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n\n---\n\n%s\n' \
            "$NPM_NAME" "${VERSION#v}" "$NPM_NAME" "${VERSION#v}" \
            "$NPM_NAME" "$GITHUB_REPOSITORY" "$VERSION" "$BODY" > /tmp/release-notes.md
          gh release edit "$VERSION" --notes-file /tmp/release-notes.md
