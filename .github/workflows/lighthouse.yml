name: Lighthouse

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'site/.lighthouserc*.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'site/.lighthouserc*.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  lighthouse:
    # Desktop AND mobile. Mobile is Lighthouse's DEFAULT emulation, not a
    # preset — `preset: "mobile"` is rejected outright ("Choices: perf,
    # experimental, desktop"), so the mobile config simply omits `preset`.
    # It is the profile where main-thread work hurts most, and it was never
    # being measured (#218).
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: desktop
            config: ./site/.lighthouserc.json
          - profile: mobile
            config: ./site/.lighthouserc.mobile.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build TypeScript (required by site import)
        run: pnpm build:ts

      - name: Build site
        run: pnpm --filter @williamzujkowski/oklch-terminal-themes-site build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ${{ matrix.config }}
          uploadArtifacts: true
          temporaryPublicStorage: true
